<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Globe Trotter - Interactive Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen" x-data="appData()" x-init="initChart()">

  <!-- Top Navigation Bar -->
  <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center space-x-3">
      <i class="fa-solid fa-earth-americas text-indigo-400 text-2xl"></i>
      <span class="text-xl font-bold tracking-wide text-white">Globe Trotter</span>
    </div>
    <div class="flex items-center space-x-4">
      <template x-if="!isShareView">
        <div class="flex items-center space-x-3">
          <button @click="currentTab = 'dashboard'" :class="currentTab === 'dashboard' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-slate-700'" class="px-3 py-1.5 rounded-lg text-sm font-medium transition">Dashboard</button>
          <button @click="currentTab = 'planner'" :class="currentTab === 'planner' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-slate-700'" class="px-3 py-1.5 rounded-lg text-sm font-medium transition">Trip Planner</button>
          <button @click="currentTab = 'budget'" :class="currentTab === 'budget' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-slate-700'" class="px-3 py-1.5 rounded-lg text-sm font-medium transition">Budget & Analytics</button>
          <button @click="toggleShareMode()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-2">
            <i class="fa-solid fa-share-nodes"></i> Share View
          </button>
        </div>
      </template>
      <template x-if="isShareView">
        <button @click="toggleShareMode()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded-lg text-sm font-medium transition">
          Exit Preview
        </button>
      </template>
    </div>
  </nav>

  <!-- Share Mode Notice Header -->
  <div x-show="isShareView" class="bg-emerald-900/50 border-b border-emerald-500/30 text-emerald-200 px-6 py-2 text-center text-sm flex items-center justify-center gap-2">
    <i class="fa-solid fa-eye"></i> Public View Mode: Reading shared itinerary for <strong x-text="activeTrip.title"></strong>
  </div>

  <main class="max-w-7xl mx-auto p-6">
    
    <!-- DASHBOARD SCREEN -->
    <section x-show="currentTab === 'dashboard' && !isShareView" class="space-y-6">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-2xl font-bold text-white">Welcome Back, Traveler!</h1>
          <p class="text-slate-400 text-sm">Manage your upcoming journeys and explore top global cities.</p>
        </div>
        <button @click="currentTab = 'planner'" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium shadow-lg shadow-indigo-600/30 transition">
          + Plan New Trip
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Trip Cards -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 hover:border-indigo-500 transition cursor-pointer" @click="currentTab = 'planner'">
          <div class="flex justify-between items-start mb-3">
            <h3 class="text-lg font-semibold text-white" x-text="activeTrip.title"></h3>
            <span class="bg-indigo-500/20 text-indigo-300 text-xs px-2.5 py-1 rounded-full border border-indigo-500/30">Active</span>
          </div>
          <p class="text-slate-400 text-xs mb-4" x-text="activeTrip.description"></p>
          <div class="text-xs text-slate-300 space-y-1">
            <p><i class="fa-regular fa-calendar mr-2 text-indigo-400"></i><span x-text="activeTrip.startDate"></span> to <span x-text="activeTrip.endDate"></span></p>
            <p><i class="fa-solid fa-location-dot mr-2 text-indigo-400"></i><span x-text="activeTrip.stops.length"></span> Stops Included</p>
          </div>
        </div>
      </div>
    </section>

    <!-- ITINERARY BUILDER SCREEN -->
    <section x-show="currentTab === 'planner' || isShareView" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Left Column: Search & Add Destinations -->
      <div x-show="!isShareView" class="space-y-6 lg:col-span-1">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-4">
          <h2 class="text-lg font-semibold text-white flex items-center gap-2">
            <i class="fa-solid fa-magnifying-glass text-indigo-400"></i> Discover Cities
          </h2>
          <input type="text" x-model="cityQuery" placeholder="Search cities (e.g. Tokyo, Paris)..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          
          <div class="space-y-2 max-h-60 overflow-y-auto">
            <template x-for="city in filteredCities" :key="city.id">
              <div class="flex justify-between items-center p-3 bg-slate-900/60 border border-slate-700/50 rounded-lg hover:border-slate-600 transition">
                <div>
                  <p class="font-medium text-sm text-white" x-text="city.name"></p>
                  <p class="text-xs text-slate-400" x-text="city.country + ' • Index: ' + city.costIndex"></p>
                </div>
                <button @click="addStop(city)" class="text-xs bg-indigo-600/30 hover:bg-indigo-600 text-indigo-300 hover:text-white px-2.5 py-1.5 rounded transition">
                  + Add Stop
                </button>
              </div>
            </template>
          </div>
        </div>

        <!-- Add Activity Form -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-4">
          <h2 class="text-lg font-semibold text-white flex items-center gap-2">
            <i class="fa-solid fa-plus-circle text-indigo-400"></i> Add Custom Item
          </h2>
          <div class="space-y-3">
            <input type="text" x-model="newItem.title" placeholder="Item/Activity name..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
            <div class="grid grid-cols-2 gap-2">
              <select x-model="newItem.category" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                <option value="activities">Activity</option>
                <option value="stay">Stay</option>
                <option value="transport">Transport</option>
                <option value="meals">Meal</option>
              </select>
              <input type="number" x-model.number="newItem.cost" placeholder="Cost ($)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>
            <button @click="addItem()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg text-sm transition">
              Add to Itinerary
            </button>
          </div>
        </div>
      </div>

      <!-- Right Column: Itinerary Timeline View -->
      <div :class="isShareView ? 'lg:col-span-3' : 'lg:col-span-2'" class="space-y-6">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6">
          <div class="flex justify-between items-start border-b border-slate-700 pb-4 mb-6">
            <div>
              <h1 class="text-2xl font-bold text-white" x-text="activeTrip.title"></h1>
              <p class="text-slate-400 text-sm mt-1" x-text="activeTrip.description"></p>
            </div>
            <div class="text-right">
              <span class="text-xs text-slate-400">Total Estimated Budget</span>
              <p class="text-2xl font-bold text-emerald-400" x-text="'$' + calculateTotalCost()"></p>
            </div>
          </div>

          <!-- Timeline Day-wise Display -->
          <div class="space-y-6">
            <template x-for="(stop, index) in activeTrip.stops" :key="stop.id">
              <div class="border-l-2 border-indigo-500 pl-4 py-1 space-y-3 relative">
                <div class="absolute -left-[9px] top-1.5 w-4 h-4 rounded-full bg-indigo-500 border-2 border-slate-800"></div>
                <div class="flex justify-between items-center">
                  <h3 class="text-lg font-semibold text-indigo-300" x-text="'Stop ' + (index + 1) + ': ' + stop.cityName"></h3>
                  <template x-if="!isShareView">
                    <button @click="removeStop(index)" class="text-xs text-rose-400 hover:underline">Remove Stop</button>
                  </template>
                </div>

                <div class="space-y-2">
                  <template x-for="(item, iIndex) in stop.items" :key="iIndex">
                    <div class="flex justify-between items-center bg-slate-900/80 p-3 rounded-lg border border-slate-700/60">
                      <div class="flex items-center space-x-3">
                        <span class="text-xs uppercase px-2 py-0.5 rounded font-semibold"
                              :class="{
                                'bg-purple-500/20 text-purple-300': item.category === 'activities',
                                'bg-blue-500/20 text-blue-300': item.category === 'stay',
                                'bg-amber-500/20 text-amber-300': item.category === 'transport',
                                'bg-emerald-500/20 text-emerald-300': item.category === 'meals'
                              }" x-text="item.category"></span>
                        <span class="text-sm text-slate-200" x-text="item.title"></span>
                      </div>
                      <span class="text-sm font-semibold text-slate-300" x-text="'$' + item.cost"></span>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </section>

    <!-- BUDGET & ANALYTICS SCREEN -->
    <section x-show="currentTab === 'budget' && !isShareView" class="space-y-6">
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-6">
        <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
          <i class="fa-solid fa-chart-pie text-indigo-400"></i> Financial Breakdown
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
          <div class="max-w-xs mx-auto">
            <canvas id="budgetChart"></canvas>
          </div>
          <div class="space-y-4">
            <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
              <span class="text-xs text-slate-400">Total Expenses</span>
              <p class="text-2xl font-bold text-emerald-400" x-text="'$' + calculateTotalCost()"></p>
            </div>
            <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
              <span class="text-xs text-slate-400">Budget Status</span>
              <p class="text-sm mt-1" :class="calculateTotalCost() > activeTrip.targetBudget ? 'text-rose-400 font-semibold' : 'text-emerald-400 font-semibold'">
                <span x-text="calculateTotalCost() > activeTrip.targetBudget ? 'Over Budget by $' + (calculateTotalCost() - activeTrip.targetBudget) : 'Within Budget limit ($' + activeTrip.targetBudget + ')'"></span>
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Application State Script -->
  <script>
    function appData() {
      return {
        currentTab: 'planner',
        isShareView: false,
        cityQuery: '',
        chartInstance: null,

        cities: [
          { id: 1, name: 'Tokyo', country: 'Japan', costIndex: 'High' },
          { id: 2, name: 'Paris', country: 'France', costIndex: 'High' },
          { id: 3, name: 'Bali', country: 'Indonesia', costIndex: 'Low' },
          { id: 4, name: 'Prague', country: 'Czech Republic', costIndex: 'Medium' }
        ],

        activeTrip: {
          title: 'Euro-Asian Express Tour',
          description: 'A 10-day cultural exploration across key iconic destinations.',
          startDate: '2026-09-10',
          endDate: '2026-09-20',
          targetBudget: 2500,
          stops: [
            {
              id: 101,
              cityName: 'Tokyo',
              items: [
                { title: 'Shinjuku Hotel Stay', category: 'stay', cost: 450 },
                { title: 'Senso-ji Temple Tour', category: 'activities', cost: 30 },
                { title: 'Ramen Tasting Experience', category: 'meals', cost: 60 }
              ]
            },
            {
              id: 102,
              cityName: 'Paris',
              items: [
                { title: 'Eiffel Tower Admission', category: 'activities', cost: 40 },
                { title: 'Metro Transit Pass', category: 'transport', cost: 35 }
              ]
            }
          ]
        },

        newItem: {
          title: '',
          category: 'activities',
          cost: ''
        },

        get filteredCities() {
          if (!this.cityQuery) return this.cities;
          return this.cities.filter(c => c.name.toLowerCase().includes(this.cityQuery.toLowerCase()) || c.country.toLowerCase().includes(this.cityQuery.toLowerCase()));
        },

        addStop(city) {
          this.activeTrip.stops.push({
            id: Date.now(),
            cityName: city.name,
            items: []
          });
          this.updateChart();
        },

        removeStop(index) {
          this.activeTrip.stops.splice(index, 1);
          this.updateChart();
        },

        addItem() {
          if (!this.newItem.title || !this.newItem.cost || this.activeTrip.stops.length === 0) return;
          this.activeTrip.stops[0].items.push({
            title: this.newItem.title,
            category: this.newItem.category,
            cost: parseFloat(this.newItem.cost)
          });
          this.newItem.title = '';
          this.newItem.cost = '';
          this.updateChart();
        },

        calculateTotalCost() {
          let total = 0;
          this.activeTrip.stops.forEach(stop => {
            stop.items.forEach(item => total += item.cost);
          });
          return total;
        },

        calculateCategoryTotals() {
          const totals = { activities: 0, stay: 0, transport: 0, meals: 0 };
          this.activeTrip.stops.forEach(stop => {
            stop.items.forEach(item => {
              if (totals[item.category] !== undefined) {
                totals[item.category] += item.cost;
              }
            });
          });
          return totals;
        },

        toggleShareMode() {
          this.isShareView = !this.isShareView;
        },

        initChart() {
          this.$nextTick(() => {
            const ctx = document.getElementById('budgetChart');
            if (!ctx) return;
            const dataTotals = this.calculateCategoryTotals();
            this.chartInstance = new Chart(ctx, {
              type: 'doughnut',
              data: {
                labels: ['Activities', 'Stay', 'Transport', 'Meals'],
                datasets: [{
                  data: [dataTotals.activities, dataTotals.stay, dataTotals.transport, dataTotals.meals],
                  backgroundColor: ['#a855f7', '#3b82f6', '#f59e0b', '#10b981']
                }]
              },
              options: { responsive: true, plugins: { legend: { labels: { color: '#cbd5e1' } } } }
            });
          });
        },

        updateChart() {
          if (!this.chartInstance) return;
          const dataTotals = this.calculateCategoryTotals();
          this.chartInstance.data.datasets[0].data = [dataTotals.activities, dataTotals.stay, dataTotals.transport, dataTotals.meals];
          this.chartInstance.update();
        }
      }
    }
  </script>
</body>
</html>
