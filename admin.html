<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globe Trotter — Admin</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Poppins"', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                    colors: {
                        ocean: { 50: '#eff9ff', 100: '#daf0ff', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' },
                        teal: { 500: '#14b8a6', 600: '#0d9488' },
                        coral: { 500: '#ff6b5c', 600: '#f4503c' },
                        ink: '#0f2942'
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="min-h-screen bg-slate-50 text-ink" x-data="adminApp()">

    <!-- ================= LOGIN ================= -->
    <div x-show="!isAdmin" x-cloak class="min-h-screen grid place-items-center p-6">
        <div class="w-full max-w-sm glass rounded-2xl shadow-card p-8">
            <div class="flex items-center gap-2 mb-6 text-ocean-600">
                <i class="fa-solid fa-user-shield text-2xl"></i>
                <span class="text-xl font-bold">Globe Trotter Admin</span>
            </div>
            <form @submit.prevent="login()" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1.5">Admin email</label>
                    <input type="email" x-model="form.email"
                        class="field w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1.5">Password</label>
                    <input type="password" x-model="form.password"
                        class="field w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm">
                </div>
                <p x-show="error" x-cloak class="text-coral-600 text-sm" x-text="error"></p>
                <button type="submit" class="btn-primary w-full py-3 rounded-xl font-semibold">Log in</button>
            </form>
            <p class="text-xs text-slate-400 mt-6">Only accounts with an <code>admin</code> role in
                <code>profiles</code> can access this panel.</p>
        </div>
    </div>

    <!-- ================= DASHBOARD ================= -->
    <div x-show="isAdmin" x-cloak>
        <nav class="bg-white border-b border-ocean-100 sticky top-0 z-40 shadow-card px-6 py-3 flex items-center gap-4">
            <div class="flex items-center gap-2 text-ocean-600">
                <i class="fa-solid fa-user-shield text-xl"></i>
                <span class="font-bold">Globe Trotter Admin</span>
            </div>
            <div class="flex items-center gap-1 ml-4">
                <button @click="tab='users'" :class="tab==='users' ? 'bg-ocean-500 text-white' : 'text-slate-600 hover:bg-ocean-50'"
                    class="px-3.5 py-2 rounded-lg text-sm font-semibold transition"><i class="fa-solid fa-users mr-1.5"></i>Users</button>
                <button @click="tab='terminal'; loadFeed()" :class="tab==='terminal' ? 'bg-ocean-500 text-white' : 'text-slate-600 hover:bg-ocean-50'"
                    class="px-3.5 py-2 rounded-lg text-sm font-semibold transition"><i class="fa-solid fa-terminal mr-1.5"></i>Terminal</button>
            </div>
            <div class="ml-auto flex items-center gap-3">
                <span class="text-sm text-slate-500" x-text="adminEmail"></span>
                <button @click="logout()" class="text-sm font-semibold text-coral-600 hover:text-coral-700">Log out</button>
            </div>
        </nav>

        <main class="max-w-6xl mx-auto p-6 space-y-6">

            <!-- ===== USERS TAB ===== -->
            <section x-show="tab==='users'">
                <div class="grid lg:grid-cols-5 gap-6">
                    <!-- user list -->
                    <div class="lg:col-span-2 bg-white border border-ocean-50 shadow-card rounded-2xl p-4">
                        <input type="text" x-model="userSearch" placeholder="Search name or email…"
                            class="field w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm mb-3">
                        <div class="space-y-1 max-h-[70vh] overflow-y-auto nice-scroll">
                            <template x-for="u in filteredUsers" :key="u.id">
                                <button @click="selectUser(u)"
                                    :class="selectedUser && selectedUser.id===u.id ? 'bg-ocean-50 border-ocean-200' : 'border-transparent hover:bg-slate-50'"
                                    class="w-full text-left p-3 rounded-xl border transition">
                                    <p class="text-sm font-semibold" x-text="u.name || '(no name)'"></p>
                                    <p class="text-xs text-slate-400" x-text="u.email"></p>
                                    <span x-show="u.role==='admin'" class="text-[10px] uppercase font-bold text-teal-600">admin</span>
                                </button>
                            </template>
                            <p x-show="filteredUsers.length===0" class="text-sm text-slate-400 italic p-3">No users found.</p>
                        </div>
                    </div>

                    <!-- user detail -->
                    <div class="lg:col-span-3 bg-white border border-ocean-50 shadow-card rounded-2xl p-6">
                        <template x-if="!selectedUser">
                            <p class="text-slate-400 italic">Select a user to view their trips, expenses and settings.</p>
                        </template>
                        <template x-if="selectedUser">
                            <div class="space-y-6">
                                <div class="flex items-start justify-between">
                                    <div>
                                        <h2 class="text-xl font-bold" x-text="selectedUser.name || '(no name)'"></h2>
                                        <p class="text-sm text-slate-500" x-text="selectedUser.email"></p>
                                    </div>
                                    <button @click="toggleAdmin(selectedUser)"
                                        class="text-xs font-semibold px-3 py-1.5 rounded-lg border"
                                        :class="selectedUser.role==='admin' ? 'border-coral-200 text-coral-600 hover:bg-coral-50' : 'border-teal-200 text-teal-600 hover:bg-teal-50'"
                                        x-text="selectedUser.role==='admin' ? 'Remove admin' : 'Make admin'"></button>
                                </div>

                                <div class="grid grid-cols-3 gap-3 text-sm">
                                    <div class="bg-slate-50 rounded-xl p-3"><span class="block text-xs text-slate-400">Phone</span><span x-text="selectedUser.phone || '—'"></span></div>
                                    <div class="bg-slate-50 rounded-xl p-3"><span class="block text-xs text-slate-400">Home city</span><span x-text="selectedUser.home_city || '—'"></span></div>
                                    <div class="bg-slate-50 rounded-xl p-3"><span class="block text-xs text-slate-400">Joined</span><span x-text="new Date(selectedUser.created_at).toLocaleDateString()"></span></div>
                                </div>
                                <p class="text-sm text-slate-600" x-show="selectedUser.bio" x-text="selectedUser.bio"></p>

                                <div>
                                    <h3 class="font-semibold text-sm mb-2 text-slate-500 uppercase tracking-wide">Trips &amp; expenses</h3>
                                    <div class="space-y-3">
                                        <template x-for="trip in userTrips" :key="trip.id">
                                            <div class="border border-slate-100 rounded-xl p-4">
                                                <div class="flex justify-between items-center">
                                                    <p class="font-semibold text-sm" x-text="trip.title"></p>
                                                    <p class="text-sm font-bold text-teal-600" x-text="'$' + tripTotal(trip)"></p>
                                                </div>
                                                <p class="text-xs text-slate-400 mb-2" x-text="'Target budget: $' + trip.target_budget"></p>
                                                <template x-for="stop in trip.stops" :key="stop.id">
                                                    <div class="ml-2 mt-1">
                                                        <p class="text-xs font-semibold text-ocean-600" x-text="stop.city_name"></p>
                                                        <template x-for="item in stop.items" :key="item.id">
                                                            <p class="text-xs text-slate-500 flex justify-between max-w-xs">
                                                                <span x-text="item.title + ' (' + item.category + ')'"></span>
                                                                <span x-text="'$' + item.cost"></span>
                                                            </p>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <p x-show="userTrips.length===0" class="text-sm text-slate-400 italic">No trips saved.</p>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </section>

            <!-- ===== TERMINAL TAB ===== -->
            <section x-show="tab==='terminal'">
                <div class="bg-[#0b1220] rounded-2xl shadow-card p-4">
                    <div class="flex items-center justify-between mb-3 px-2">
                        <div class="flex items-center gap-2 text-slate-400 text-xs font-mono">
                            <span class="w-2.5 h-2.5 rounded-full bg-coral-500 inline-block"></span>
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span>
                            <span class="w-2.5 h-2.5 rounded-full bg-teal-500 inline-block"></span>
                            <span class="ml-2">activity — live</span>
                        </div>
                        <button @click="loadFeed()" class="text-xs text-slate-400 hover:text-white"><i class="fa-solid fa-rotate mr-1"></i>Refresh</button>
                    </div>
                    <div id="feedBox" class="font-mono text-[13px] leading-6 text-teal-300 h-[65vh] overflow-y-auto nice-scroll px-2">
                        <template x-for="(line, i) in feed" :key="i">
                            <div>
                                <span class="text-slate-500" x-text="'[' + line.time + ']'"></span>
                                <span class="text-ocean-400" x-text="line.user"></span>
                                <span class="text-slate-300" x-text="line.action"></span>
                                <span class="text-slate-500" x-text="line.details"></span>
                            </div>
                        </template>
                        <p x-show="feed.length===0" class="text-slate-500 italic">No activity yet.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="admin.js"></script>
</body>

</html>
